# JVM settings for the Gradle daemon — the box has 7.6 GB RAM total.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX is required by AGP 8+; no Jetifier needed (no legacy support libs).
android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
