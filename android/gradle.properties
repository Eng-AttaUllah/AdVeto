# JVM settings — this box has 7.6 GB RAM with ~2 GB typically free, so the
# heap is deliberately small: an earlier -Xmx3g build had its daemon OOM-killed
# during dex merging. Keep these conservative.
org.gradle.jvmargs=-Xmx1500m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.workers.max=1

# The Kotlin compile daemon is a separate JVM — cap it too.
kotlin.daemon.jvmargs=-Xmx512m

# AndroidX is required by AGP 8+; no Jetifier needed (no legacy support libs).
android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
